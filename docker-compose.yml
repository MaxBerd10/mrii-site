services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrii}
      POSTGRES_USER: ${POSTGRES_USER:-mrii}
      # Dev default; override with POSTGRES_PASSWORD in a .env file for production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrii}
    volumes:
      - mrii_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrii -d mrii"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-mrii-docker-dev-change-me-please}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,*}
      POSTGRES_DB: ${POSTGRES_DB:-mrii}
      POSTGRES_USER: ${POSTGRES_USER:-mrii}
      # Change this in production via a .env file — the default is dev-only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrii}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8443,http://127.0.0.1:8443,https://mrii-site.vercel.app}
      # Lokal admin ichidagi «Sayt» tugmasi ishlayotgan Vite sahifasini ochadi.
      # Productionga chiqarishda .env ichida haqiqiy domenni bering.
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8443}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000,https://mrii-site.vercel.app}
      MEDIA_URL: /media/
      SEED_SUPERUSER: ${SEED_SUPERUSER:-1}
      # Set these in a .env file for production. With DEBUG=False and no password
      # here, the seeder mints a strong random one and prints it to the logs.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - mrii_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  mrii_pgdata:
  mrii_media:
