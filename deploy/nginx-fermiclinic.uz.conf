# FJSTI — fermiclinic.uz (Nginx + Let's Encrypt)
# Sayt: /home/mrii-site/dist
# API/Admin/Static: Docker → 127.0.0.1:8001

# Rate limits (http context: this file is included from sites-enabled).
# The Django layer has its own throttles/lockout; these stop floods earlier and cheaper.
limit_req_zone $binary_remote_addr zone=fjsti_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fjsti_login:10m rate=30r/m;

upstream mrii_django {
    server 127.0.0.1:8001;
    keepalive 8;
}

# www → apex (HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name www.fermiclinic.uz;
    return 301 https://fermiclinic.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fermiclinic.uz;

    ssl_certificate /etc/letsencrypt/live/fermiclinic.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fermiclinic.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://fermiclinic.uz$request_uri;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fermiclinic.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    return 301 https://fermiclinic.uz$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fermiclinic.uz;

    ssl_certificate /etc/letsencrypt/live/fermiclinic.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fermiclinic.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    limit_req_status 429;
    client_max_body_size 32m;

    # Django admin CSS/JS (WhiteNoise)
    location ^~ /static/ {
        proxy_pass http://mrii_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Brute-force brake on the login form (Django also locks out after 10 failures / 15 min).
    location = /admin/login/ {
        limit_req zone=fjsti_login burst=10 nodelay;
        client_max_body_size 1m;
        proxy_pass http://mrii_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /admin/ {
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://mrii_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=fjsti_api burst=30 nodelay;
        client_max_body_size 8m;  # resume limit is 5 MB
        proxy_pass http://mrii_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /media/ {
        limit_except GET HEAD { deny all; }
        client_max_body_size 1m;
        proxy_read_timeout 600s;
        proxy_pass http://mrii_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    root /home/mrii-site/dist;
    index index.html;

    # NB: no X-Frame-Options on the SPA on purpose — Telegram Web/Desktop embed the HR Mini App
    # (/hr) in an iframe. For clickjacking protection use CSP frame-ancestors with Telegram's origins.
    # Security headers only on the static site. Django already sets its own for
    # /admin and /api, so they are NOT added at server level (would duplicate).
    # NB: nginx does not inherit add_header into a location that defines its own,
    # hence the repeated block below.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}
