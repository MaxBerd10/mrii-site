<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Kelajak tibbiyoti — sunʼiy intellekt bilan bugun. Farg’ona Jamoat Salomatligi Tibbiyot Instituti"
    />
    <title>Farg’ona Jamoat Salomatligi Tibbiyot Instituti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent native hash scroll on load (legacy bookmarks).
      (function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        window.scrollTo(0, 0)
        document.documentElement.scrollTop = 0
        if (!location.hash || location.hash === '#') return
        document.documentElement.classList.add('no-smooth-scroll')
        try {
          sessionStorage.setItem('fjsti-hash', location.hash)
        } catch (_) {}
        history.replaceState(null, '', location.pathname + location.search)
      })()
      ;(function () {
        var ua = navigator.userAgent
        if (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|OPiOS/.test(ua)) {
          document.documentElement.classList.add('is-safari')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
